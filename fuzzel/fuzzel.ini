[main]
font=Iosevka:size=12
width=30
lines=5
prompt="> "
terminal=kitty
match-mode=fuzzy
horizontal-pad=12
vertical-pad=8
inner-pad=6
layer=overlay
exit-on-keyboard-focus-loss=yes
show-actions=no
[colors]
background=000000ff
text=ffffffff
match=cececeff
selection=181818ff
selection-text=ffffffff
selection-match=ffffffff
border=8d8d8dff

[border]
width=1
radius=0

[key-bindings]
delete-line-forward=none
prev=Up Control+k
next=Down Control+j
cancel=Escape
